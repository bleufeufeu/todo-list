<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://fonts.googleapis.com/css?family=Orbitron"
      rel="stylesheet"
      type="text/css"
    />
    <title>Todo List</title>
  </head>
  <body>
    <div class="sidebar">
      <div class="sidelogo">
        <i class="fa-solid fa-clipboard-list"></i> Todo List
      </div>
      <div class="sidemain">
        <div class="sidebutton" id="allButton">
          <i class="fas fa-tasks"></i> All Tasks
        </div>
        <div class="sidebutton" id="todayButton">
          <i class="fa-solid fa-calendar-days"></i> Today
        </div>
        <div class="sidebutton" id="overdueButton">
          <i class="fa-solid fa-clock"></i> Overdue
        </div>
        <div class="sidebutton" id="completedButton">
          <i class="fa-solid fa-circle-check"></i> Completed
        </div>
      </div>
      <div class="sideoptions">
        <div id="projectsHeader">Projects</div>
        <div id="projectsList"></div>

        <div id="projFormContainer" class="hidden">
          <form id="newProjectForm">
            <input
              type="text"
              id="newProjTitle"
              placeholder="Enter title here..."
              required
            />
            <button type="submit"><i class="fa-solid fa-check"></i></button>
            <i id="cancelProj" class="fa-solid fa-x"></i>
          </form>
        </div>
        <div class="sidebutton" id="addProject">
          <i class="fa-solid fa-circle-plus"></i> Add Project
        </div>
      </div>
    </div>

    <div class="main">
      <div id="projectTitle"></div>
      <div id="newTodo"><i class="fa-solid fa-circle-plus"></i> Add Task</div>

      <div id="todoFormContainer" class="hidden">
        <form id="newTodoForm">
          <div class="todoFormLeft">
            <input name="taskName" type="text" id="newTodoTitle" placeholder="Task name (required)" required />
            <input name="taskDate" type="date" id="newTodoDueDate" required />
            <select name="taskPriority" required>
              <option value="" selected disabled>Priority (required)</option>
              <option value="Low">Low</option>
              <option value="Medium">Medium</option>
              <option value="Urgent">Urgent</option>
            </select>
            <select name="taskProject" id="selectProject" required>
              <option value="" selected disabled>Project (required)</option>
            </select>
          </div>

          <div class="todoFormRight">
            <input
              name="taskDescription"
              type="text"
              id="newTodoDescription"
              placeholder="Describe the task (optional)"
            />
            <div class="todoFormButtons">
              <button id="cancelTodo">Cancel</button>
              <button id="addTodo" type="submit">Add</button>
            </div>
          </div>
        </form>
      </div>

      <div id="todosDisplay"></div>
    </div>
  </body>
</html>
